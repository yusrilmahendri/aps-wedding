<div class="qrm">

  <!-- Header -->
  <div class="qrm__header">
    <h5 class="qrm__title">
      <i class="fas fa-qrcode mr-2"></i>{{ title }}
    </h5>
    <button type="button" class="qrm__close" (click)="closeModal()" aria-label="Tutup">
      <i class="fas fa-times"></i>
    </button>
  </div>

  <!-- Body -->
  <div class="qrm__body">

    <!-- Loading -->
    <div *ngIf="isGenerating" class="qrm__state">
      <div class="spinner-border text-success" role="status">
        <span class="sr-only">Membuat QR code...</span>
      </div>
      <p class="qrm__state-text mt-3">Membuat QR code...</p>
    </div>

    <!-- Error -->
    <div *ngIf="errorMessage && !isGenerating" class="qrm__state">
      <i class="fas fa-exclamation-triangle qrm__error-icon mb-3"></i>
      <p class="text-danger mb-3">{{ errorMessage }}</p>
      <button class="btn btn-outline-danger btn-sm" (click)="retryGeneration()">
        <i class="fas fa-redo mr-1"></i>Coba Lagi
      </button>
    </div>

    <!-- QR Display — Guest Attendance Mode -->
    <div *ngIf="!isGenerating && !errorMessage && useGuestQR" class="qrm__guest">
      <div class="qrm__canvas-wrap">
        <canvas #qrCanvas class="qrm__canvas"></canvas>
        <button
          class="qrm__fullscreen-btn"
          type="button"
          (click)="toggleFullscreen()"
          title="Tampilkan layar penuh">
          <i class="fas fa-expand"></i>
        </button>
      </div>

      <!-- Scan Status Pill -->
      <div
        class="qrm__scan-status"
        [ngClass]="{
          'qrm__scan-status--idle':    scanStatus === 'idle',
          'qrm__scan-status--success': scanStatus === 'success',
          'qrm__scan-status--error':   scanStatus === 'error'
        }"
        role="status"
        aria-live="polite">
        <ng-container [ngSwitch]="scanStatus">
          <span *ngSwitchCase="'idle'">
            <i class="fas fa-circle-notch fa-spin mr-2"></i>Menunggu scan...
          </span>
          <span *ngSwitchCase="'success'">
            <i class="fas fa-check-circle mr-2"></i>{{ scanStatusMessage }}
          </span>
          <span *ngSwitchCase="'error'">
            <i class="fas fa-times-circle mr-2"></i>{{ scanStatusMessage }}
          </span>
        </ng-container>
      </div>

      <!-- Download only in guest mode -->
      <div class="qrm__actions mt-3">
        <button class="btn qrm__btn-dl" (click)="downloadQRCode()" aria-label="Unduh QR code">
          <i class="fas fa-download mr-2"></i>Unduh QR
        </button>
      </div>
    </div>

    <!-- QR Display — Share / Invite Mode -->
    <div *ngIf="!isGenerating && !errorMessage && !useGuestQR" class="qrm__share">
      <div class="qrm__canvas-wrap">
        <canvas #qrCanvas class="qrm__canvas"></canvas>
      </div>

      <!-- URL Strip -->
      <div class="qrm__url-strip mt-3">
        <div class="input-group">
          <input
            type="text"
            class="form-control qrm__url-input"
            [value]="url"
            readonly
            aria-label="URL undangan">
          <div class="input-group-append">
            <button class="btn qrm__copy-btn" type="button" (click)="copyUrl()" aria-label="Salin URL">
              <i class="fas fa-copy"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="qrm__actions mt-3">
        <button class="btn qrm__btn-share" (click)="shareUrl()" aria-label="Bagikan undangan">
          <i class="fas fa-share-alt mr-2"></i>Bagikan
        </button>
        <button class="btn qrm__btn-dl" (click)="downloadQRCode()" aria-label="Unduh QR code">
          <i class="fas fa-download mr-2"></i>Unduh QR
        </button>
      </div>
    </div>

  </div><!-- /body -->
</div>

<!-- Fullscreen Overlay -->
<div class="qrm-fs" *ngIf="isFullscreen" (click)="toggleFullscreen()" aria-modal="true" role="dialog">
  <div class="qrm-fs__inner" (click)="$event.stopPropagation()">
    <button class="qrm-fs__close" (click)="toggleFullscreen()" aria-label="Tutup layar penuh">
      <i class="fas fa-compress"></i>
    </button>
    <canvas #qrCanvasFull class="qrm-fs__canvas"></canvas>
    <p class="qrm-fs__hint">Tap di luar untuk menutup</p>
  </div>
</div>
