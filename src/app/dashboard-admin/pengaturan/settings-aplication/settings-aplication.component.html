<div class="container">
  <div class="row g-4">
    <!-- Loading State -->
    <div *ngIf="isLoading" class="col-12 text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="mt-3 text-muted">Memuat pengaturan kontak...</p>
    </div>

    <!-- Contact Admin Form -->
    <form
      *ngIf="!isLoading"
      [formGroup]="contactForm"
      (ngSubmit)="onSubmit()"
      class="col-12 d-flex form-container"
      autocomplete="off"
      novalidate>
      <h2>Contact Admin</h2>

      <!-- Host Email -->
      <div class="mb-3">
        <label for="host-email" class="form-label">Host Email</label>
        <input
          id="host-email"
          formControlName="host_email"
          type="email"
          placeholder="admin@example.com"
          class="form-control"
          [class.is-invalid]="f['host_email'].invalid && f['host_email'].touched" />
        <div class="invalid-feedback" *ngIf="f['host_email'].invalid && f['host_email'].touched">
          <div *ngIf="f['host_email'].errors?.['email']">Email tidak valid</div>
        </div>
      </div>

      <!-- Email -->
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input
          id="email"
          formControlName="email"
          type="email"
          placeholder="contact@example.com"
          class="form-control"
          [class.is-invalid]="f['email'].invalid && f['email'].touched" />
        <div class="invalid-feedback" *ngIf="f['email'].invalid && f['email'].touched">
          <div *ngIf="f['email'].errors?.['email']">Email tidak valid</div>
        </div>
      </div>

      <!-- Nama -->
      <div class="mb-3">
        <label for="nama" class="form-label">Nama</label>
        <input
          id="nama"
          formControlName="nama"
          type="text"
          placeholder="Nama Admin"
          class="form-control"
          [class.is-invalid]="f['nama'].invalid && f['nama'].touched" />
        <div class="invalid-feedback" *ngIf="f['nama'].invalid && f['nama'].touched">
          <div *ngIf="f['nama'].errors?.['maxlength']">Nama maksimal 255 karakter</div>
        </div>
      </div>

      <!-- No WhatsApp -->
      <div class="mb-3">
        <label for="no-whatsapp" class="form-label">No WhatsApp</label>
        <input
          id="no-whatsapp"
          formControlName="whatsapp"
          type="text"
          placeholder="08123456789"
          class="form-control"
          [class.is-invalid]="f['whatsapp'].invalid && f['whatsapp'].touched" />
        <div class="invalid-feedback" *ngIf="f['whatsapp'].invalid && f['whatsapp'].touched">
          <div *ngIf="f['whatsapp'].errors?.['maxlength']">Nomor WhatsApp maksimal 255 karakter</div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="d-flex gap-2 justify-content-end mt-4">
        <button
          type="button"
          class="btn btn-danger"
          (click)="onDelete()"
          [disabled]="isSubmitting || !contactData"
          *ngIf="contactData">
          <span *ngIf="!isSubmitting">Hapus</span>
          <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-1"></span>
        </button>
        <button
          type="submit"
          class="btn btn-simpan"
          [disabled]="isSubmitting">
          <span *ngIf="!isSubmitting">Simpan</span>
          <span *ngIf="isSubmitting">
            <span class="spinner-border spinner-border-sm me-1"></span>
            Menyimpan...
          </span>
        </button>
      </div>
    </form>
  </div>
</div>
