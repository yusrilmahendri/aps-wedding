<section class="story-section">

  <div class="story-overlay"></div>

  <div class="story-container">

    <h1 class="story-title">
      Cerita Kami
      <span class="title-line"></span>
    </h1>

    <div class="timeline-wrapper" *ngIf="hasStories(); else noStoriesTemplate">

      <div class="timeline-line"></div>

      <div
        *ngFor="let story of getStories(); let i = index; trackBy: trackByStoryId"
        class="timeline-item"
        [ngClass]="{ 'left': i % 2 === 0, 'right': i % 2 !== 0 }"
      >

        <div class="timeline-dot"></div>

        <div class="timeline-card">
          <div class="timeline-date">
            {{ getFormattedDate(story.tanggal_cerita) }}
          </div>

          <div class="timeline-title">
            {{ story.title }}
          </div>

          <div class="timeline-content">
            {{ story.lead_cerita }}
          </div>
        </div>

      </div>

    </div>

    <ng-template #noStoriesTemplate>
      <div class="timeline-wrapper">
        <div class="timeline-line"></div>
        <div class="timeline-item left">
          <div class="timeline-dot"></div>
          <div class="timeline-card">
            <div class="timeline-date">Tanggal akan diumumkan</div>
            <div class="timeline-title">Cerita Pertama</div>
            <div class="timeline-content">
              Cerita akan segera ditambahkan...
            </div>
          </div>
        </div>
      </div>
    </ng-template>

    <div class="flower-decoration">
      <img src="assets/flower.png" alt="Flower decoration">
    </div>

  </div>

</section>
