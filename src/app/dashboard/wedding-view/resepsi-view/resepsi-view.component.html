<section class="resepsi-section">

  <div class="resepsi-container">

    <!-- LEFT IMAGE SLIDER -->
    <div class="resepsi-media" *ngIf="galleryImages?.length">

      <div class="slider-track"
           [style.transform]="'translateX(-' + currentSlide * 100 + '%)'">

        <div class="slide" *ngFor="let img of galleryImages">
          <img [src]="img" alt="Resepsi Image">
          <div class="image-overlay"></div>
        </div>

      </div>

    </div>

    <!-- RIGHT CONTENT -->
    <div class="resepsi-content">

      <div class="resepsi-card">

        <h1 class="resepsi-title">
          Resepsi
          <span class="title-accent"></span>
        </h1>

        <div class="resepsi-details" *ngIf="hasValidEvent(); else noResepsi">
          <div class="date">{{ getFormattedDate() }}</div>
          <div class="time">{{ getFormattedTime() }}</div>
          <div class="location">di {{ getLocation() }}</div>
        </div>

        <ng-template #noResepsi>
          <div class="resepsi-details">
            <div>Tanggal akan diumumkan</div>
            <div>Waktu akan diumumkan</div>
            <div>Lokasi akan diumumkan</div>
          </div>
        </ng-template>

        <button class="location-button"
                *ngIf="getMapsLink()"
                (click)="openMapsLocation()">
          Petunjuk Lokasi
        </button>

      </div>

    </div>

  </div>

</section>
