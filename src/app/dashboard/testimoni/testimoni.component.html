<div class="testimoni-container">
  <div class="form-section">
    <div class="form-header">
      <div class="title-bar"></div>
      <h2 class="form-title">Testimoni Pengguna</h2>
    </div>

    <p class="form-subtitle">
      Bagikan pengalaman Anda menggunakan layanan kami
    </p>

    <form [formGroup]="reviewForm" (ngSubmit)="onSubmit()" class="review-form">
      <div class="form-group">
        <label for="provinsi" class="form-label">
          Provinsi <span class="required">*</span>
        </label>
        <input
          type="text"
          id="provinsi"
          formControlName="provinsi"
          class="form-control"
          [class.is-invalid]="hasFieldError('provinsi')"
          placeholder="Masukkan provinsi Anda">
        <div *ngIf="hasFieldError('provinsi')" class="error-message">
          {{ getFieldError('provinsi') }}
        </div>
      </div>

      <div class="form-group">
        <label for="kota" class="form-label">
          Kota <span class="required">*</span>
        </label>
        <input
          type="text"
          id="kota"
          formControlName="kota"
          class="form-control"
          [class.is-invalid]="hasFieldError('kota')"
          placeholder="Masukkan kota Anda">
        <div *ngIf="hasFieldError('kota')" class="error-message">
          {{ getFieldError('kota') }}
        </div>
      </div>

      <div class="form-group">
        <label for="ulasan" class="form-label">
          Ulasan <span class="required">*</span>
        </label>
        <textarea
          id="ulasan"
          formControlName="ulasan"
          class="form-control"
          rows="6"
          [class.is-invalid]="hasFieldError('ulasan')"
          placeholder="Tulis ulasan Anda di sini (minimal 10 karakter)"></textarea>
        <div class="char-counter">
          {{ reviewForm.get('ulasan')?.value?.length || 0 }} / 1000 karakter
        </div>
        <div *ngIf="hasFieldError('ulasan')" class="error-message">
          {{ getFieldError('ulasan') }}
        </div>
      </div>

      <div class="form-actions">
        <button
          type="submit"
          class="btn-submit"
          [disabled]="isSubmitting || reviewForm.invalid">
          <span *ngIf="!isSubmitting">Kirim Testimoni</span>
          <span *ngIf="isSubmitting">
            <span class="spinner"></span>
            Mengirim...
          </span>
        </button>
      </div>
    </form>
  </div>
</div>
