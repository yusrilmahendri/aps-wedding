<div class="container-fluid p-3 p-sm-4">
  <!-- Header -->
  <div class="d-flex align-items-center mb-4">
    <div class="pink-bar me-3"></div>
    <h1 class="fs-4 fw-semibold mb-0" style="color:#f472b6;">Riwayat Tagihan</h1>
  </div>

  <!-- Loading spinner -->
  <div *ngIf="isLoading" class="text-center py-5" data-cy="bill-loading">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="mt-2 text-muted">Memuat data tagihan...</p>
  </div>

  <!-- Error -->
  <div *ngIf="!isLoading && errorMessage" class="alert alert-danger" data-cy="bill-error" role="alert">
    {{ errorMessage }}
  </div>

  <!-- Table -->
  <div *ngIf="!isLoading && !errorMessage" class="card shadow-sm">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table align-middle mb-0" data-cy="bill-table">
          <thead class="table-light">
            <tr>
              <th>No Invoice</th>
              <th>Tanggal</th>
              <th>Paket</th>
              <th>Status</th>
              <th>Harga</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let row of billingRows" data-cy="bill-row">
              <td><strong>{{ row.no_invoice }}</strong></td>
              <td>{{ row.tanggal_transaksi }}</td>
              <td>{{ row.paket }}</td>
              <td>
                <span class="badge text-white"
                  [ngClass]="{
                    'bg-success': row.status === 'settlement' || row.status === 'paid' || row.status === 'capture',
                    'bg-warning text-dark': row.status === 'pending',
                    'bg-danger': row.status === 'deny' || row.status === 'cancel' || row.status === 'expire' || row.status === 'failure'
                  }"
                  data-cy="bill-status">
                  {{ row.statusLabel }}
                </span>
              </td>
              <td>{{ formatCurrency(row.harga) }}</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Empty state -->
      <p *ngIf="billingRows.length === 0"
         class="text-center text-muted py-4"
         data-cy="bill-empty">
        Belum ada riwayat pembayaran.
      </p>
    </div>
  </div>
</div>
